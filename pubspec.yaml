name: mdreader
description: An offline-capable, GitHub-styled Markdown documentation explorer and reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true